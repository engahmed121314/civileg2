# ============================================================================
# CivilEG2 — Gradle Performance Configuration
# Optimized for local development and CI/CD
# ============================================================================

# ── JVM & JDK Configuration ──────────────────────────────────────────────────
# 4GB heap for compilation + KSP/Hilt annotation processing
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseSerialGC

# ── Build Parallelism ───────────────────────────────────────────────────────
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# ── Kotlin Daemon ──────────────────────────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC

# ── Android ────────────────────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Build Performance ──────────────────────────────────────────────────────
# Skip non-essential tasks during development
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderScript=false
android.defaults.buildfeatures.resValues=false
android.defaults.buildfeatures.shaders=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# Use local JDK instead of downloading toolchain
org.gradle.java.installations.paths=/home/z/my-project/jdk/amazon-corretto-21.0.12.12.1-linux-x64
org.gradle.java.installations.auto-download=true
