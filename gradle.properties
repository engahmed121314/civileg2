# ============================================================================
# CivilEG2 — Gradle Performance Configuration
# Optimized for local development and CI/CD
# ============================================================================
# ── Build Performance ──────────────────────────────────────────────
# Skip non-essential tasks during development
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderScript=false
android.defaults.buildfeatures.resValues=false
android.defaults.buildfeatures.shaders=false
android.nonTransitiveRClass=true
# ── Android ────────────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
# ── Kotlin Daemon ──────────────────────────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=false
# ── JVM Configuration ─────────────────────────────────────────────────────────
# 3GB heap for compilation + KSP/Hilt annotation processing (16GB RAM laptop)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# ── Build Parallelism ───────────────────────────────────────────────────────
org.gradle.parallel=false
# Limit workers to physical cores; release idle RAM; faster file watching
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=900000
org.gradle.vfs.watch=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# AGP 9 opt-out (temporary): keep legacy DSL + external kotlin-android plugin
android.newDsl=false
android.builtInKotlin=false
