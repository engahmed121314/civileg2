# ============================================================================
# CivilEG2 — Gradle Performance Configuration
# Optimized for local development and CI/CD
# ============================================================================
# ── Build Performance ──────────────────────────────────────────────
# Skip non-essential tasks during development
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderScript=false
android.defaults.buildfeatures.resValues=false
android.defaults.buildfeatures.shaders=false
android.nonTransitiveRClass=true
# ── Android ────────────────────────────────────────────────────────
android.useAndroidX=true
kotlin.code.style=official
# ── Kotlin Daemon ──────────────────────────────────────────────────────────
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC
org.gradle.caching=false
org.gradle.configuration-cache=false
# ── JVM Configuration ─────────────────────────────────────────────────────────
# 6GB heap for compilation + KSP/Hilt annotation processing
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# ── Build Parallelism ───────────────────────────────────────────────────────
org.gradle.parallel=false
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
# AGP 9 opt-out (temporary): keep legacy DSL + external kotlin-android plugin
android.newDsl=false
android.builtInKotlin=false
