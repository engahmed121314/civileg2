version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 5
    reviewers:
      - "engahmed121314"
    labels:
      - "dependencies"
      - "automated"
    # itext 8 -> 9 is a breaking major (removes setBold/setItalic/setBorder/
    # setPadding used by PdfGenerator). Keep 8.x until a deliberate
    # PdfGenerator migration is scheduled.
    ignore:
      - dependency-name: "com.itextpdf:itext-core"
        update-types:
          - "version-update:semver-major"
    # Group related bumps into one PR each to cut review noise. First matching
    # group wins; "misc" catches everything not matched above it.
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "kotlin*"
      androidx:
        patterns:
          - "androidx.*"
      google-play:
        patterns:
          - "com.google.android.*"
          - "com.android.billingclient*"
      firebase:
        patterns:
          - "com.google.firebase*"
      hilt:
        patterns:
          - "com.google.dagger*"
      ksp:
        patterns:
          - "com.google.devtools.ksp*"
      android-gradle-plugin:
        patterns:
          - "com.android.*"
          - "gradle"
          - "gradle-wrapper"
      misc:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci/cd"
      - "dependencies"
    # One monthly PR for all action bumps instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"
