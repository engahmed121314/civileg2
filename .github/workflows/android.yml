# ============================================================================
# CivilEG2 — Android CI/CD Pipeline
# Triggers on push to master and pull requests
# Runs: Guards → Lint → Unit Tests → Coverage → Debug Build (two flavors)
# ============================================================================

name: Android CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:   # every PR, including stacked PRs whose base is another feature branch
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

permissions:
  contents: read

jobs:
  # ─── Job 1: Export Guard Checks ───────────────────────────────────────
  guards:
    name: Export Guard Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ezdxf
        run: pip install ezdxf

      - name: Run Arabic PDF export guard
        run: python tools/guards/no_arabic_in_exports.py

      - name: Run contrast + theme guard
        run: python -I tools/guards/contrast_check.py .

      - name: Run DXF validator
        run: python tools/guards/dxf_validate.py tools/

      - name: Run duplicate-engine guard (Phase 2 single source of truth)
        run: python tools/guards/no_duplicate_engines.py

  # ─── Job 2: Lint Check ────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guards]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Lint always runs to completion so the report exists for the budget
      # check and the uploaded artifacts, even when errors are found.
      - name: Run Android Lint
        run: ./gradlew lintFreeDebug --no-daemon
        continue-on-error: true

      # Ratchet: fail only when errors exceed the budget recorded in
      # .github/lint-error-budget, so NEW lint errors block the build while
      # pre-existing ones are tolerated until fixed. Lower the budget file
      # whenever errors are fixed; never raise it without a comment.
      - name: Enforce lint error budget
        run: |
          REPORT=app/build/reports/lint-results-freeDebug.xml
          if [ ! -f "$REPORT" ]; then
            echo "::error::Lint report not found at $REPORT - lint did not run to completion (build/configuration failure)"
            exit 1
          fi
          ERRORS=$(grep -c 'severity="Error"' "$REPORT" || true)
          echo "Lint errors found: $ERRORS"
          BUDGET_FILE=.github/lint-error-budget
          if [ ! -f "$BUDGET_FILE" ]; then
            echo "::warning::$ERRORS lint error(s) found; no budget set yet ($BUDGET_FILE missing), so this is non-blocking"
            exit 0
          fi
          BUDGET=$(tr -d '[:space:]' < "$BUDGET_FILE")
          if [ "$ERRORS" -gt "$BUDGET" ]; then
            echo "::error::$ERRORS lint error(s) exceed the budget of $BUDGET; fix the new lint errors before merging"
            exit 1
          fi
          echo "Lint errors within budget ($ERRORS <= $BUDGET)"

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-freeDebug.html
            app/build/reports/lint-results-freeDebug.xml
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 3: Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # SDK 34 and 35 android-all-instrumented jars for Robolectric, served from a local dir via
      # ROBOLECTRIC_DEPS_DIR (app/build.gradle.kts testOptions). Cached; the sha1 is checked on every
      # run (cache hit or download), a bad cached jar is deleted and replaced. The anchors below are the
      # sha1 values already pinned in this file. To renew a poisoned cache, bump -v1 in the key.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: .robolectric-deps
          key: robolectric-android-all-v1-14-robolectric-10818077-i7-dd5e1d35-15-robolectric-12650502-i7-4a727564

      - name: Provision Robolectric android-all jar
        timeout-minutes: 12
        run: |
          set -euo pipefail
          DIR="$GITHUB_WORKSPACE/.robolectric-deps"
          mkdir -p "$DIR"
          BUDGET=600        # global seconds for both jars (step timeout-minutes is 12 = 720 s)
          REQ_MAX=90        # per-request max seconds
          CONNECT_MAX=20
          DEFAULT_RA=30     # explicit policy when a 429/503 carries no Retry-After
          RA_MAX=120        # a longer server-requested wait fails without retry
          RETRY_PAUSE=10    # pause after a transport error or other HTTP status
          BASE="https://repo1.maven.org/maven2"
          START=$(date +%s)
          remaining() { echo $(( BUDGET - ( $(date +%s) - START ) )); }
          WORK="$(mktemp -d)"
          cleanup() { rm -rf "$WORK"; }
          trap cleanup EXIT
          # Final response only (curl -D lists every redirect hop). Prints: absent | secs:N | bad:<value>
          retry_after() {
            python3 - "$1" <<'PY'
          import sys, email.utils, datetime
          blocks, cur = [], []
          for line in open(sys.argv[1], errors="replace").read().replace("\r", "").split("\n"):
              if line.startswith("HTTP/"):
                  cur = []; blocks.append(cur)
              elif cur is not None and blocks:
                  cur.append(line)
          val = None
          if blocks:
              for line in blocks[-1]:
                  if line.lower().startswith("retry-after:"):
                      val = line.split(":", 1)[1].strip()
          if val is None:
              print("absent")
          elif val.isdigit():
              print("secs:" + val)
          else:
              try:
                  dt = email.utils.parsedate_to_datetime(val)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=datetime.timezone.utc)
                  d = (dt - datetime.datetime.now(datetime.timezone.utc)).total_seconds()
                  print("secs:%d" % max(0, int(d) + (1 if d % 1 else 0)))
              except Exception:
                  print("bad:" + val[:80])
          PY
          }
          fail() { echo "::error::$1"; exit 1; }
          for entry in "14-robolectric-10818077-i7 dd5e1d356107e9d99ebf58beb5329debe2849140" "15-robolectric-12650502-i7 4a72756411af462a4ca89b355b0834799dc8258e"; do
            V="${entry%% *}"; SHA1="${entry##* }"
            JAR="$DIR/android-all-instrumented-$V.jar"
            URL="$BASE/org/robolectric/android-all-instrumented/$V/android-all-instrumented-$V.jar"
            if [ -f "$JAR" ]; then
              if echo "$SHA1  $JAR" | sha1sum -c - >/dev/null 2>&1; then
                echo "cache hit, sha1 verified (0 fetches): $V"; continue
              fi
              echo "::warning::cached $V failed sha1; deleted and replaced from the origin (actions/cache never overwrites an existing key: bump the -vN key suffix to renew it)"
              rm -f "$JAR"
            fi
            ok=0
            for attempt in 1 2 3; do
              REM=$(remaining)
              [ "$REM" -ge 15 ] || fail "provision budget (${BUDGET}s) exhausted before attempt $attempt for $V"
              MAXT=$REQ_MAX; [ "$REM" -ge "$MAXT" ] || MAXT=$REM
              HDR="$WORK/hdr"; PART="$WORK/part"; ERR="$WORK/err"; rm -f "$HDR" "$PART" "$ERR"
              set +e
              CODE="$(curl -sS -L --connect-timeout "$CONNECT_MAX" --max-time "$MAXT" -D "$HDR" -o "$PART" -w '%{http_code}' "$URL" 2>"$ERR")"
              RC=$?
              set -e
              echo "attempt $attempt for $V: curl_rc=$RC http=${CODE:-none} (max ${MAXT}s)"
              grep -iE '^(HTTP/|retry-after:|date:)' "$HDR" 2>/dev/null | tr -d '\r' || true
              [ ! -s "$ERR" ] || head -c 200 "$ERR" | tr -d '\r' || true
              if [ "$RC" -eq 0 ] && [ "$CODE" = "200" ]; then
                ACT="$(sha1sum "$PART" | cut -d' ' -f1)"
                if [ "$ACT" = "$SHA1" ]; then mv "$PART" "$JAR"; ok=1; break; fi
                fail "checksum mismatch for $V: expected $SHA1 actual $ACT (not retried, bad part discarded)"
              fi
              if [ "$RC" -eq 0 ] && { [ "$CODE" = "429" ] || [ "$CODE" = "503" ]; }; then
                RA="$(retry_after "$HDR")"
                case "$RA" in
                  absent) WAIT=$DEFAULT_RA; echo "no Retry-After; policy wait ${WAIT}s" ;;
                  secs:*) WAIT="${RA#secs:}"
                          [ "$WAIT" -le "$RA_MAX" ] || fail "server asked to wait ${WAIT}s (Retry-After), over the ${RA_MAX}s limit; not retrying. Re-run later." ;;
                  *) fail "unparseable Retry-After value: ${RA#bad:}" ;;
                esac
              else
                WAIT=$RETRY_PAUSE
              fi
              [ "$attempt" != 3 ] || break
              REM=$(remaining)
              [ $(( WAIT + 15 )) -le "$REM" ] || fail "wait ${WAIT}s plus a request cannot fit the remaining ${REM}s budget for $V"
              echo "waiting ${WAIT}s before attempt $((attempt+1))"
              sleep "$WAIT"
            done
            [ "$ok" = 1 ] || fail "no verified Robolectric jar $V after 3 bounded attempts (last curl_rc=$RC http=${CODE:-none})"
            echo "downloaded, sha1 verified: $V"
          done
          echo "ROBOLECTRIC_DEPS_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testFreeDebugUnitTest testPlayDebugUnitTest --no-daemon

      - name: Generate JaCoCo coverage report
        run: ./gradlew :app:jacocoTestReport --no-daemon

      # Coverage ratchet: fails if coverage drops below the baseline defined
      # in app/build.gradle.kts (jacocoCoverageVerification).
      - name: Verify coverage thresholds
        run: ./gradlew :app:jacocoCoverageVerification --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: app/build/reports/jacoco/jacocoTestReport/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 4: Debug APK Build ──────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleFreeDebug assemblePlayDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: civileg2-debug
          path: |
            app/build/outputs/apk/free/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
          retention-days: 7
          if-no-files-found: error


  # --- Job 4: Compose UI tests on an emulator -------------------------------
  ui-test:
    name: Compose UI Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew connectedFreeDebugAndroidTest --no-daemon

      - name: Upload instrumentation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: app/build/reports/androidTests/
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 5: Build Summary ────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build-debug, ui-test]
    steps:
      - name: Check results
        run: |
          echo "## Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug Build | ${{ needs.build-debug.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| UI Tests (Emulator) | ${{ needs.ui-test.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
  gate:
    name: CI Gate
    if: always()
    needs: [guards, lint, test, build-debug, ui-test]
    runs-on: ubuntu-latest
    env:
      GUARDS_RESULT: ${{ needs.guards.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.test.result }}
      BUILD_RESULT: ${{ needs.build-debug.result }}
      UITEST_RESULT: ${{ needs.ui-test.result }}
    steps:
      - name: Fail if any required job did not succeed
        run: |
          echo "guards=$GUARDS_RESULT lint=$LINT_RESULT test=$TEST_RESULT build=$BUILD_RESULT ui-test=$UITEST_RESULT"
          for r in "$GUARDS_RESULT" "$LINT_RESULT" "$TEST_RESULT" "$BUILD_RESULT" "$UITEST_RESULT"; do
            if [ "$r" != "success" ]; then
              echo "CI Gate: a required job did not succeed ($r)"
              exit 1
            fi
          done
          echo "CI Gate: all required jobs succeeded"
