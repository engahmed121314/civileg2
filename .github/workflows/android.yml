# ============================================================================
# CivilEG2 — Android CI/CD Pipeline
# Triggers on push to master and pull requests
# Runs: Guards → Lint → Unit Tests → Debug Build (two flavors)
# ============================================================================

name: Android CI/CD

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

permissions:
  contents: read

jobs:
  # ─── Job 1: Export Guard Checks ───────────────────────────────────────
  guards:
    name: Export Guard Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install ezdxf
        run: pip install ezdxf

      - name: Run Arabic PDF export guard
        run: python tools/guards/no_arabic_in_exports.py

      - name: Run contrast + theme guard
        run: python -I tools/guards/contrast_check.py .

      - name: Run DXF validator
        run: python tools/guards/dxf_validate.py tools/ || true

  # ─── Job 2: Lint Check ────────────────────────────────────────────────
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guards]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Lint (non-blocking)
        run: ./gradlew lintFreeDebug --no-daemon
        continue-on-error: true

      - name: Check lint severity
        run: |
          if [ -f app/build/reports/lint-results-debug.xml ]; then
            ERRORS=$(grep -c 'severity="error"' app/build/reports/lint-results-debug.xml 2>/dev/null || true)
            echo "Lint errors found: $ERRORS"
            if [ "$ERRORS" -gt 0 ]; then
              echo "::warning::$ERRORS lint error(s) found; see the uploaded lint report"
            fi
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 2: Unit Tests ────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testFreeDebugUnitTest testPlayDebugUnitTest --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # ─── Job 3: Debug APK Build ──────────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleFreeDebug assemblePlayDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: civileg2-debug
          path: |
            app/build/outputs/apk/free/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
          retention-days: 7
          if-no-files-found: error

  # ─── Job 5: Build Summary ────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, test, build-debug]
    steps:
      - name: Check results
        run: |
          echo "## Build Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Debug Build | ${{ needs.build-debug.result == 'success' && 'Passed' || 'Failed' }} |" >> $GITHUB_STEP_SUMMARY