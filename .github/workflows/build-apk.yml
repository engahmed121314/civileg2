name: Build Release APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-linux-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-linux-

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias civileg \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass civileg2024 \
            -keypass civileg2024 \
            -dname "CN=CivilEG, OU=Dev, O=CivilEG, L=Cairo, ST=Cairo, C=EG"

      - name: Build release APK
        env:
          KEY_ALIAS: civileg
          KEY_PASSWORD: civileg2024
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: civileg2024
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: civileg2-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
