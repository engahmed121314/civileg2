# Diagnostic-only emulator run for the real-button column capture case.
# Isolated from android.yml on purpose: the ordinary CI gate stays red while
# unit tests fail; this workflow never relaxes a required job, never uses
# continue-on-error, and runs only the single diagnostic instrumentation
# class so its result reads as exactly what it is. Bootstrap mirrors the
# existing ui-test job (same JDK/Gradle/KVM/emulator options; no extra
# secrets or services beyond checkout).
name: Diagnostic Column Capture (Emulator)
on:
  workflow_dispatch:
  push:
    branches: [fix/column-drawing-schematic-contract]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  diag-column-capture:
    name: Real-button capture case (API 33 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the single real-button capture case (retention inside script, original status preserved)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # Cleanup of any stale shared mirror, then the single-line sequence the
          # runner needs: gradle, save status, pull the SHARED mirror (app-private
          # dirs are wiped by the post-test uninstall and FUSE-blocked to the
          # shell; shared Downloads files survive both), logcat, original exit.
          script: adb shell rm -rf /sdcard/Download/capture-emulator-evidence; ./gradlew connectedFreeDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.civileg.app.qa.ColumnRecordedSheetEmulatorTest --no-daemon; STATUS=$?; mkdir -p diag-capture-evidence; adb pull /sdcard/Download/capture-emulator-evidence diag-capture-evidence/capture-emulator-evidence; PULL=$?; adb logcat -d > diag-capture-evidence/logcat-full.txt; echo "gradle-status=$STATUS evidence-pull-status=$PULL"; exit $STATUS

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-column-capture-evidence
          path: |
            diag-capture-evidence/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
