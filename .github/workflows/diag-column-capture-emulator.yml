# Diagnostic-only emulator run for the real-button column capture case.
# Isolated from android.yml on purpose: the ordinary CI gate stays red while
# unit tests fail; this workflow never relaxes a required job, never uses
# continue-on-error, and runs only the single diagnostic instrumentation
# class so its result reads as exactly what it is. Bootstrap mirrors the
# existing ui-test job (same JDK/Gradle/KVM/emulator options; no extra
# secrets or services beyond checkout).
name: Diagnostic Column Capture (Emulator)
on:
  workflow_dispatch:
  push:
    branches: [fix/column-drawing-schematic-contract]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  diag-column-capture:
    name: Real-button capture case (API 33 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the single real-button capture case (retention inside script, original status preserved)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          # The emulator runner executes each script line in its own shell, so
          # the whole sequence stays on ONE line: run gradle, save its status,
          # guarded evidence extraction, logcat, exit the original status.
          # API 33 scoped storage blocks a plain adb pull of
          # /sdcard/Android/data, so evidence is streamed out with run-as
          # (the debug build is debuggable); the plain pull remains a fallback.
          script: ./gradlew connectedFreeDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.civileg.app.qa.ColumnRecordedSheetEmulatorTest --no-daemon; STATUS=$?; mkdir -p diag-capture-evidence; adb exec-out run-as com.civileg.app.debug tar -cf - -C /sdcard/Android/data/com.civileg.app.debug/files capture-emulator-evidence > diag-capture-evidence/evidence.tar && tar -xf diag-capture-evidence/evidence.tar -C diag-capture-evidence || adb pull /sdcard/Android/data/com.civileg.app.debug/files/capture-emulator-evidence diag-capture-evidence/capture-emulator-evidence; PULL=$?; adb logcat -d > diag-capture-evidence/logcat-full.txt; echo "gradle-status=$STATUS evidence-pull-status=$PULL"; exit $STATUS

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-column-capture-evidence
          path: |
            diag-capture-evidence/
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
