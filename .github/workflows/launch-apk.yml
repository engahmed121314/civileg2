name: Standalone launch evidence

# Installs the debug APK on an emulator and starts it from the launcher
# (monkey LAUNCHER intent, no instrumentation) to capture splash, home and Beam screens.
on:
  workflow_dispatch:
  push:
    branches: [ "review/**" ]

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Build free debug APK
        run: ./gradlew assembleFreeDebug --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch from launcher
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash tools/ci/standalone_launch.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standalone-launch
          path: |
            launch-out
            app/build/outputs/apk/free/debug/*.apk
          retention-days: 7
